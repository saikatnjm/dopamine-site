# Production-like:  docker compose up --build            -> http://localhost:3000
# Development:      docker compose up --build dev        -> http://localhost:3000 (hot reload)
# Checks:           docker compose run --rm dev sh -c "npm install && npm run check"
# Run only one of app/dev at a time (both use port 3000).

services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    image: dopamine-web:local
    ports:
      - "3000:3000"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: dopamine-web:dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
