name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Repository variable (Settings → Secrets and variables → Actions → Variables).
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Build before tsc: `next build` generates next-env.d.ts and route types
      # that the standalone type check needs.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit
